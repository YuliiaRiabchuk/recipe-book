# Після кожного пушу в main (зокрема нотатки, збережені зі сторінки) перезбирає дані й публікує сайт.
# Комміт бота з GITHUB_TOKEN не запускає workflow вдруге, тож циклу немає.
name: Збирання і публікація

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Залежності
        run: pip install PyYAML

      - name: Валідація і збирання
        run: python scripts/build.py

      - name: Закомітити перезібрані дані
        run: |
          if [ -n "$(git status --porcelain -- data site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data site
            git commit -m "Перезбирання сторінки"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
